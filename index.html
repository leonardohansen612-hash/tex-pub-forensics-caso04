const appScreen=$('#appScreen'),appTitle=$('#appTitle'),appBody=$('#appBody');
function initials(name){return name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function visible(name){const all=evidence[name]||[];return [all.filter(r=>has(r[0])),all.filter(r=>!has(r[0]))]}
function lockMsg(n){return n?`<div class="locked">🔒 ${n} registro(s) ainda criptografado(s). Encontre novos códigos físicos e use o GrayKey.</div>`:''}
function genericRows(name){const [v,h]=visible(name);return `<div class="iosgroup">${v.map(r=>`<div class="iosrow"><div class="avatar">${initials(r[1])}</div><div class="main"><b>${r[1]} <span class="level">N${r[0]}</span></b><p>${r[2]}</p></div></div>`).join('')}</div>${lockMsg(h.length)}`}
function renderPhone(){const [v,h]=visible("Telefone");return `<div class="sectionlabel">Recentes</div><div class="iosgroup">${v.map(r=>`<div class="iosrow"><div class="avatar" style="color:${r[3]==='miss'?'#ff3b30':'#34c759'}">☎</div><div class="main"><b>${r[1]}</b><p>${r[2]}</p></div><time>${r[3]==='miss'?'perdida':''}</time></div>`).join('')}</div>${lockMsg(h.length)}`}
function renderMessages(name){
 if(name!=="WhatsApp"){const [v,h]=visible(name);return `<div class="iosgroup">${v.map(r=>`<div class="iosrow"><div class="avatar">${initials(r[1])}</div><div class="main"><b>${r[1]}</b><p>${r[2]}</p></div></div>`).join('')}</div>${lockMsg(h.length)}`}
 const [v,h]=visible("WhatsApp"), people=[...new Set(v.map(r=>r[1]))];
 return `<div class="sectionlabel">Conversas</div><div class="iosgroup">${people.map(person=>{const msgs=v.filter(r=>r[1]===person),last=msgs[msgs.length-1];return `<div class="iosrow chatrow" onclick="openWhatsChat('${person.replace(/'/g,"\'")}')"><div class="avatar">${initials(person)}</div><div class="main"><b>${person}</b><p>${last[4]?last[4]:last[2]}</p></div><time>${last[3]||''}</time><span class="chev">›</span></div>`}).join('')}</div>${lockMsg(h.length)}`
}
function openWhatsChat(person){
 const all=(evidence["WhatsApp"]||[]).filter(r=>r[1]===person&&has(r[0]));
 appTitle.textContent="WhatsApp";
 appBody.innerHTML=`<div class="waBg"><div class="chathead"><button class="back" onclick="openApp('WhatsApp')">‹</button><div class="avatar">${initials(person)}</div><div class="who"><b>${person}</b><small>WhatsApp</small></div></div><div class="waDay">Mensagens disponíveis na extração atual</div>${all.map(r=>`<div class="waBubble ${r[2]==='out'?'out':'in'}">${r[5]?'<small style="display:block;color:#8e8e93;margin-bottom:3px">RECUPERADA</small>':''}${r[4]}<time>${r[3]}${r[2]==='out'?' ✓✓':''}</time><div style="clear:both"></div></div>`).join('')}<div class="waInput"><span>＋</span><div class="fake">Mensagem</div><span>🎙</span></div></div>`;
}
function renderMail(){const [v,h]=visible("E-mail");return `<div class="sectionlabel">Caixa de Entrada</div>${v.map(r=>`<div class="mailrow"><b>${r[1]}</b><div class="sub">Helena Duarte</div><p>${r[2]}</p></div>`).join('')}${lockMsg(h.length)}`}
function renderNotes(){const [v,h]=visible("Notas");return v.map(r=>`<div class="notecard"><b>${r[1]}</b><p>${r[2]}</p></div>`).join('')+lockMsg(h.length)}
function renderSafari(){const [v,h]=visible("Safari");return `<div class="safariTop"><div class="address">🔒 Histórico e Pesquisas</div></div>${v.map(r=>`<div class="searchitem"><small>${r[1]}</small><div style="margin-top:6px;font-size:15px">${r[2]}</div></div>`).join('')}${lockMsg(h.length)}`}
function renderMaps(){const [v,h]=visible("Mapas");return `<div class="mapmock"><div class="pin">📍</div></div><div class="iosgroup">${v.map(r=>`<div class="iosrow"><div class="main"><b>${r[1]}</b><p>${r[2]}</p></div></div>`).join('')}</div>${lockMsg(h.length)}`}
function renderCalendar(){const [v,h]=visible("Calendário");return `<div class="calday"><div class="date">DOMINGO, 15 DE JUNHO</div>${v.map(r=>`<div class="event"><b>${r[1]}</b><p>${r[2]}</p></div>`).join('')}</div>${lockMsg(h.length)}`}
function renderVoice(){const [v,h]=visible("Gravador");return v.map(r=>`<div class="voiceitem"><b>${r[1]}</b><div class="wave"></div><p style="color:#666;font-size:13px">${r[2]}</p></div>`).join('')+lockMsg(h.length)}
function renderTerminal(){
 appScreen.classList.add('forensic');
 const labels=["0010 — Cronômetro","4232 — Bexigas","3142 — Quiz","9765 — Comanda","3144 — QR / diagrama","684034 — Padrões TEX PUB"];
 return `<div class="terminalbox"><b>GrayKey Bridge — Caso 04</b><p style="color:#aaa;font-size:13px">Insira um código encontrado no Tex Pub.</p><input id="pinInput" inputmode="numeric" placeholder="Código"><button id="pinBtn">DESBLOQUEAR</button><div id="pinResult"></div></div><div class="terminalbox">${labels.map((x,i)=>`<div class="levelrow"><b>Nível ${i+1}</b><div class="${has(i+1)?'ok':'bad'}">${has(i+1)?'● LIBERADO — '+x:'○ BLOQUEADO'}</div></div>`).join('')}</div><div class="terminalbox"><button id="resetBtn" style="background:#333">Resetar investigação</button></div>`;
}

const casePhotos=Array.from({length:15},(_,i)=>`assets/photos/F${String(i+1).padStart(2,'0')}.jpg`);
const photoLevels={
  1:1,2:1,
  3:2,4:2,5:2,
  6:3,7:3,
  8:4,9:4,10:4,
  11:5,12:5,13:5,
  14:6,15:6
};
function renderPhotoGallery(){
 const cards=casePhotos.map((src,i)=>{
   const num=i+1,label=`F${String(num).padStart(2,'0')}`,lvl=photoLevels[num];
   if(!has(lvl)){
     return `<button class="photoTile lockedPhoto" disabled title="Foto criptografada — Nível ${lvl}">
       <div class="photoLock">🔒</div>
       <span>${label}</span>
       <small>NÍVEL ${lvl}</small>
     </button>`;
   }
   return `<button class="photoTile" onclick="openPhoto('${src}','${label}')">
     <img src="${src}" alt="${label}">
     <span>${label}</span>
   </button>`;
 }).join('');
 return `<div class="photosGrid">${cards}</div>`;
}
function openPhoto(src,label){
 appBody.innerHTML=`<div class="photoFull"><button class="photoClose" onclick="openApp('Fotos')">‹ Fotos</button><img src="${src}" alt="${label}"><div class="photoCaption">${label}</div></div>`;
}
function openApp(name){
 appScreen.classList.remove('forensic');appTitle.textContent=name;
 if(name==="Fotos") appBody.innerHTML=renderPhotoGallery();
 else if(name==="Telefone") appBody.innerHTML=renderPhone();
 else if(name==="Mensagens"||name==="WhatsApp") appBody.innerHTML=renderMessages(name);
 else if(name==="E-mail") appBody.innerHTML=renderMail();
 else if(name==="Notas") appBody.innerHTML=renderNotes();
 else if(name==="Safari") appBody.innerHTML=renderSafari();
 else if(name==="Mapas") appBody.innerHTML=renderMaps();
 else if(name==="Calendário") appBody.innerHTML=renderCalendar();
 else if(name==="Gravador") appBody.innerHTML=renderVoice();
 else if(name==="Terminal") appBody.innerHTML=renderTerminal();
 else appBody.innerHTML=genericRows(name);
 appScreen.classList.add('open');
 if(name==="Fotos") bindPhotos();
 if(name==="Terminal") {
   setTimeout(()=>{
    $('#pinBtn').onclick=()=>{const v=$('#pinInput').value.trim(),l=codes[v];if(!l){$('#pinResult').innerHTML='<p class="bad">Código inválido.</p>';return}if(!has(l)){unlocked.push(l);unlocked.sort();save()}openApp("Terminal")};
    $('#resetBtn').onclick=()=>{unlocked=[];save();openApp("Terminal")};
   },0)
 }
}
document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));
$('#backBtn').onclick=()=>{appScreen.classList.remove('open','forensic');appBody.innerHTML=''};
</script>
</body>
